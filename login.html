<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#071426">

    <title>JC PLAY - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <h1>JC PLAY</h1>

        <p>Bem-vindo ao seu entretenimento</p>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Usuário"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Senha"
                required
            >

            <select id="server" required>
                <option value="">Escolha seu servidor</option>
                <option value="1">Servidor 1</option>
                <option value="2">Servidor 2</option>
                <option value="3">Servidor 3</option>
                <option value="4">Servidor 4</option>
                <option value="5">Servidor 5</option>
                <option value="6">Servidor 6</option>
                <option value="7">Servidor 7</option>
                <option value="8">Servidor 8</option>
            </select>

            <button type="submit">
                ENTRAR
            </button>

        </form>

        <p class="footer">
            JC PLAY © 2026
        </p>

    </div>

    <script>
        document.getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            alert("Tela de login criada! A conexão será configurada na próxima etapa.");

        });
    </script>

</body>
</html>
